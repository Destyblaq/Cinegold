<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineGold | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #070707;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 34px;
            color: #D4AF37;
            letter-spacing: 2px;
        }

        .logo p {
            color: #A5A5A5;
            margin-top: 7px;
        }

        .login-box {
            background: #111111;
            border: 1px solid #2B2B2B;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .login-box h2 {
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            color: #A5A5A5;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #2B2B2B;
            background: #070707;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #D4AF37;
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #D4AF37;
            color: #070707;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #FFD21F;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #A5A5A5;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #D4AF37;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>CINEGOLD</h1>
            <p>Administrator Portal</p>
        </div>

        <div class="login-box">

            <h2>Admin Login</h2>

            <p class="subtitle">
                Sign in to manage your CineGold platform.
            </p>

            <div id="message" class="message"></div>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="email">Admin Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@cinegold.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login to Dashboard
                </button>

            </form>

            <a href="index.html" class="back">
                ← Back to CineGold
            </a>

        </div>

    </div>

    <script>
        const form = document.getElementById("adminLoginForm");
        const message = document.getElementById("message");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = form.querySelector(".login-btn");

        function showMessage(text, type) {
            message.style.display = "block";

            if (type === "error") {
                message.style.background = "#2B1414";
                message.style.color = "#ff4d4d";
            } else if (type === "success") {
                message.style.background = "#12261A";
                message.style.color = "#22C55E";
            } else {
                message.style.background = "#2B2B2B";
                message.style.color = "#FFD21F";
            }

            message.textContent = text;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            loginBtn.disabled = true;
            loginBtn.textContent = "Signing in...";

            fetch("http://localhost:3000/api/admin-login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (!data.success) {
                        showMessage(
                            data.message || "Invalid admin credentials.",
                            "error"
                        );

                        loginBtn.disabled = false;
                        loginBtn.textContent = "Login to Dashboard";
                        return;
                    }

                    const session = {
                        id: data.user.id,
                        name: data.user.name,
                        email: data.user.email,
                        role: data.user.role,
                        token: data.token,
                        loggedIn: true,
                        loginTime: new Date().toISOString()
                    };

                    // Admin session is kept separate from the regular
                    // user session so an admin login doesn't overwrite
                    // (or get overwritten by) a normal user's session.
                    sessionStorage.setItem(
                        "cinegold_admin_session",
                        JSON.stringify(session)
                    );

                    showMessage("Admin login successful! Redirecting...", "success");

                    setTimeout(function () {
                        window.location.href = "admin.html";
                    }, 1000);
                })
                .catch(function (error) {
                    console.error("Admin login error:", error);

                    showMessage(
                        "Could not connect to the server. Please make sure the backend is running.",
                        "error"
                    );

                    loginBtn.disabled = false;
                    loginBtn.textContent = "Login to Dashboard";
                });
        });
    </script>

</body>
</html>
